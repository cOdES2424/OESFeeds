name: Violation Search

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional test date (MM/DD/YYYY or YYYY-MM-DD). Test runs do not update the RSS feed.'
        required: false
        type: string

  schedule:
    - cron: '0 12 * * *'  # 12:00 PM UTC (6:00 AM Central Standard Time; 7:00 AM during daylight time)
    - cron: '0 19 * * *'  # 7:00 PM UTC (1:00 PM Central Standard Time; 2:00 PM during daylight time)

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    environment: login

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Violation Search
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TEST_DATE: ${{ github.event.inputs.test_date || '' }}
        run: python ViolationSearch.py

      - name: Show Git status
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_date == '' }}
        run: git status --short

      - name: Commit updated RSS feed
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_date == '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add violation_search_feed.xml

          if git diff --cached --quiet; then
            echo 'No RSS changes to commit.'
            exit 0
          fi

          git commit -m 'Update violation search RSS feed'
          git pull --rebase
          git push
